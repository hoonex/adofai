plugins { id 'com.android.application' }
android {
 namespace 'dev.hoonex.adofai.loaderinstaller'
 compileSdk 35
 defaultConfig { applicationId 'dev.hoonex.adofai.loaderinstaller'; minSdk 34; targetSdk 35; versionCode 6; versionName '1.0.5' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE','META-INF/NOTICE.txt','META-INF/*.kotlin_module'] } }
}
dependencies {
 implementation 'org.smali:dexlib2:2.5.2'
 implementation 'com.google.guava:guava:31.1-android'
 implementation 'com.android.tools.build:apksig:8.6.1'
 implementation 'com.android:zipflinger:8.6.1'
}
