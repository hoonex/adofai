name: Probe archived ADOFAI 2.4.0 Drive build

on:
  push:
    branches: [fix/v240-custom-bugfix]
    paths: ['.github/workflows/v240-gdrive-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Google Drive file
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist/v240-gdrive-probe
          ID='1UAQ9IXOv8zNfBruDmUj23dkUcjlLg2uN'
          URL="https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t"
          curl -L -A 'Mozilla/5.0' --connect-timeout 20 --max-time 60 \
            -r 0-63 -D dist/v240-gdrive-probe/headers.txt \
            -o dist/v240-gdrive-probe/head.bin "$URL" || true
          xxd -p -l 64 dist/v240-gdrive-probe/head.bin | tr -d '\n' | tee dist/v240-gdrive-probe/magic.txt || true
          echo >> dist/v240-gdrive-probe/magic.txt
          file dist/v240-gdrive-probe/head.bin | tee dist/v240-gdrive-probe/file.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: adofai-v240-gdrive-probe
          path: dist/v240-gdrive-probe/
          retention-days: 2
