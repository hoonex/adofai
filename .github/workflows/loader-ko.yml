name: Build Korean loader
on:
  push:
    branches: [loader-installer]
    paths: [localization/**, .github/workflows/loader-ko.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: loader-installer
      - name: Fetch upstream source
        run: git clone --depth 1 --branch v1.1.10.1 https://github.com/Harrot114514/ADOFAI-MobileLevelLoder.git "$RUNNER_TEMP/upstream"
      - name: Check revision and localize
        run: |
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = 722f7f6392bff8322957ba1abb7fd8735f89d09e
          python3 localization/localize.py "$RUNNER_TEMP/upstream"
          python3 localization/picker/apply.py "$RUNNER_TEMP/upstream"
      - name: Build ARM64 library
        run: |
          NDK_ROOT="$ANDROID_HOME/ndk/27.3.13750724"
          if [ ! -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++" ]; then
            curl -fLSs --retry 2 https://dl.google.com/android/repository/android-ndk-r27d-linux.zip -o "$RUNNER_TEMP/ndk.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
            NDK_ROOT="$RUNNER_TEMP/android-ndk-r27d"
          fi
          export NDK_ROOT
          bash "$RUNNER_TEMP/upstream/loader/build_ci.sh"
      - name: Validate and publish library
        run: |
          cp "$RUNNER_TEMP/upstream/loader/out/libadofailoader.so" dist/libadofailoader-ko-v1.1.10.1-ko.2.so
          cp "$RUNNER_TEMP/upstream/LICENSE" localization/UPSTREAM-LICENSE.txt
          readelf -h dist/libadofailoader-ko-v1.1.10.1-ko.2.so | grep AArch64
          readelf -Ws dist/libadofailoader-ko-v1.1.10.1-ko.2.so | grep JNI_OnLoad
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('dist/libadofailoader-ko-v1.1.10.1-ko.2.so')
          data=p.read_bytes()
          for s in ('한국어','맵 불러오기','파일 선택','내 파일에서 ZIP 열기'):
              assert s.encode() in data,s
          meta=dict(upstream='v1.1.10.1',revision='ko.2',file=p.name,sha256=hashlib.sha256(data).hexdigest(),size=len(data))
          pathlib.Path('dist/ko-loader-saf.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/libadofailoader-ko-v1.1.10.1-ko.2.so dist/ko-loader-saf.json localization/UPSTREAM-LICENSE.txt
          git commit -m "Publish verified Korean loader v1.1.10.1-ko.2" || exit 0
          git pull --rebase origin loader-installer
          git push origin HEAD:loader-installer
