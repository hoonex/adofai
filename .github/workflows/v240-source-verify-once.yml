name: Audit Exact ADOFAI 2.4 Custom Source

on:
  push:
    branches: [fix/v240-custom-bugfix]
    paths:
      - '.github/workflows/v240-source-verify-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact archived source candidate
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/v240-static-audit
          python3 -m pip install --quiet --disable-pip-version-check 'gdown==5.2.0'
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess

          EXPECTED_SIZE = 370092054
          EXPECTED_SHA = '630f519ae1ab3391aad95da90ebc296f4f0f8ae4ea41024ace7349d93926ef30'
          IDS = (
              '1aTmEKCgTijMvCuOuDlmA-uU6VEUStBqw',
              '1UAQ9IXOv8zNfBruDmUj23dkUcjlLg2uN',
          )
          OUT = 'V2.4.0 Custom.apk'
          REPORT = 'dist/v240-static-audit/source-report.txt'

          def fingerprint(path):
              if not os.path.isfile(path):
                  return None
              size = os.path.getsize(path)
              digest = hashlib.sha256()
              with open(path, 'rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return size, digest.hexdigest()

          def exact(path):
              return fingerprint(path) == (EXPECTED_SIZE, EXPECTED_SHA)

          diagnostics = []
          for file_id in IDS:
              candidate = f'dist/v240-static-audit/gdown-{file_id}.apk'
              try:
                  proc = subprocess.run(
                      ['gdown', f'https://drive.google.com/uc?id={file_id}', '-O', candidate],
                      check=False,
                      timeout=180,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )
                  diagnostics.append(f'id={file_id} rc={proc.returncode}')
                  if proc.stdout:
                      diagnostics.append(proc.stdout[-2000:])
              except Exception as exc:
                  diagnostics.append(f'id={file_id} exception={exc!r}')

              if exact(candidate):
                  os.replace(candidate, OUT)
                  diagnostics.append(f'EXACT_SOURCE_RESOLVED={file_id}')
                  break

              if os.path.exists(candidate):
                  diagnostics.append(f'id={file_id} non_match={fingerprint(candidate)!r}')
                  os.remove(candidate)

          os.makedirs(os.path.dirname(REPORT), exist_ok=True)
          with open(REPORT, 'w', encoding='utf-8') as report:
              report.write(f'expected_size={EXPECTED_SIZE}\n')
              report.write(f'expected_sha256={EXPECTED_SHA}\n')
              if exact(OUT):
                  size, sha = fingerprint(OUT)
                  report.write('AUDIT_STATUS=EXACT_SOURCE_RESOLVED\n')
                  report.write(f'source_size={size}\nsource_sha256={sha}\n')
                  open('dist/v240-static-audit/exact-source-resolved', 'w').write('yes\n')
              else:
                  report.write('AUDIT_STATUS=SOURCE_UNAVAILABLE\n')
                  report.write('EXACT_SOURCE_MATCH=NO\n')
              report.write('\n'.join(diagnostics))
              report.write('\n')
          PY

          if [[ -f dist/v240-static-audit/exact-source-resolved ]]; then
            echo 'exact=true' >> "$GITHUB_OUTPUT"
            echo 'Exact source resolved; static audit will run.'
          else
            echo 'exact=false' >> "$GITHUB_OUTPUT"
            echo 'Exact source unavailable; fail closed and skip evidence promotion.'
            cat dist/v240-static-audit/source-report.txt
          fi

      - name: Exact source fingerprint matches
        if: steps.resolve.outputs.exact == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK='V2.4.0 Custom.apk'
          EXPECTED_SIZE=370092054
          EXPECTED_SHA='630f519ae1ab3391aad95da90ebc296f4f0f8ae4ea41024ace7349d93926ef30'
          SIZE=$(stat -c '%s' "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          printf 'source_size=%s\nsource_sha256=%s\n' "$SIZE" "$SHA" | tee -a dist/v240-static-audit/source-report.txt
          test "$SIZE" = "$EXPECTED_SIZE"
          test "$SHA" = "$EXPECTED_SHA"
          echo 'EXACT_SOURCE_MATCH=YES' | tee -a dist/v240-static-audit/source-report.txt

      - name: Original IL2CPP payload fingerprints match
        if: steps.resolve.outputs.exact == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK='V2.4.0 Custom.apk'
          mkdir -p dist/v240-static-audit/extracted
          unzip -p "$APK" 'lib/arm64-v8a/libil2cpp.so' > dist/v240-static-audit/extracted/libil2cpp.so
          unzip -p "$APK" 'assets/bin/Data/Managed/Metadata/global-metadata.dat' > dist/v240-static-audit/extracted/global-metadata.dat
          IL2CPP_SHA=$(sha256sum dist/v240-static-audit/extracted/libil2cpp.so | awk '{print $1}')
          META_SHA=$(sha256sum dist/v240-static-audit/extracted/global-metadata.dat | awk '{print $1}')
          printf 'libil2cpp_sha256=%s\nglobal_metadata_sha256=%s\n' "$IL2CPP_SHA" "$META_SHA" | tee -a dist/v240-static-audit/source-report.txt
          test "$IL2CPP_SHA" = 'c86d7ff549eeef7ecef2c8471019f771e609b3ce7cccf3f775625531b43f3494'
          test "$META_SHA" = '26b6c4c711eb43815092925cad2fad99c9de12ba9665d880b7f3e6792823d6f9'

      - name: Exact metadata exposes TileDimensions ABI names
        if: steps.resolve.outputs.exact == 'true'
        shell: bash
        run: |
          set -euo pipefail
          strings -a dist/v240-static-audit/extracted/global-metadata.dat > dist/v240-static-audit/metadata-strings.txt
          for name in TileDimensions scrFloor lengthMult widthMult scnGame ApplyEventsToFloors; do
            grep -Fx "$name" dist/v240-static-audit/metadata-strings.txt | head -1
          done
          grep -E '^(TileDimensions|scrFloor|lengthMult|widthMult|scnGame|ApplyEventsToFloors)$' \
            dist/v240-static-audit/metadata-strings.txt | sort -u \
            | tee dist/v240-static-audit/tile-dimensions-abi-names.txt

      - name: Download pinned Cpp2IL 2022.0.7 analyzer
        if: steps.resolve.outputs.exact == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/SamboyCoding/Cpp2IL/releases/download/2022.0.7/Cpp2IL-2022.0.7-Linux'
          curl -fL --retry 3 --connect-timeout 20 "$URL" -o dist/v240-static-audit/Cpp2IL
          chmod +x dist/v240-static-audit/Cpp2IL
          sha256sum dist/v240-static-audit/Cpp2IL | tee dist/v240-static-audit/cpp2il-sha256.txt
          echo 'Cpp2IL source tag commit: 844e286b3858b31966af0e01bd0a5e22c864140f' >> dist/v240-static-audit/cpp2il-sha256.txt

      - name: Cpp2IL parses exact APK metadata
        if: steps.resolve.outputs.exact == 'true'
        shell: bash
        env:
          NO_COLOR: 'true'
        run: |
          set -euo pipefail
          mkdir -p dist/v240-static-audit/cpp2il-out
          dist/v240-static-audit/Cpp2IL \
            --game-path='V2.4.0 Custom.apk' \
            --output-root=dist/v240-static-audit/cpp2il-out \
            --skip-analysis \
            --skip-method-dumps \
            --disable-registration-prompts \
            2>&1 | tee dist/v240-static-audit/cpp2il.log
          test -d dist/v240-static-audit/cpp2il-out

      - name: Cpp2IL typed dump exposes TileDimensions surfaces
        if: steps.resolve.outputs.exact == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n --include='*.txt' -E 'TileDimensions|scrFloor|lengthMult|widthMult|scnGame|ApplyEventsToFloors' \
            dist/v240-static-audit/cpp2il-out | head -320 \
            | tee dist/v240-static-audit/cpp2il-tile-dimensions-surface.txt
          for name in TileDimensions lengthMult widthMult ApplyEventsToFloors; do
            grep -R -q --include='*.txt' "$name" dist/v240-static-audit/cpp2il-out
          done

      - name: Stage text-only static audit evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/v240-static-audit/extracted dist/v240-static-audit/cpp2il-out dist/v240-static-audit/Cpp2IL
          rm -f 'V2.4.0 Custom.apk'
          find dist/v240-static-audit -type f -size +5M -delete
          find dist/v240-static-audit -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v240-exact-source-static-audit
          path: dist/v240-static-audit/
          if-no-files-found: error
          retention-days: 3
