name: Build ADOFAI 3.3.1 Custom Game Builder

on:
  push:
    branches:
      - feat/modern-mobile-editor-tiles
    paths:
      - 'android/game-patcher/**'
      - 'android/mobile-editor-shell/**'
      - 'tools/apply_hitmargin_*.py'
      - 'tools/apply_mobile_editor_*.py'
      - 'scripts/build-payload.sh'
      - 'scripts/prepare-upstream.sh'
      - '.github/workflows/game-patcher.yml'
      - 'tests/test_modern_game_upgrade.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-game-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install reproducible Android toolchain
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platforms;android-35' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865'

      - name: Verify production game builder safety contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_game_patcher_contract.py'
          python3 -m unittest discover -s tests -p 'test_modern_game_upgrade.py'
          python3 -m unittest discover -s tests -p 'test_modern_tile_selection.py'

      - name: Build canonical editor payload
        run: bash scripts/build-payload.sh .work/game-patcher-payload

      - name: Stage payload into patcher assets
        run: |
          set -euo pipefail
          ASSETS=android/game-patcher/app/src/main/assets/payload
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp .work/game-patcher-payload/classes2.dex "$ASSETS/classes2.dex"
          cp .work/game-patcher-payload/libOctober.so "$ASSETS/libOctober.so"
          test -s "$ASSETS/classes2.dex"
          test -s "$ASSETS/libOctober.so"

      - name: Compile production game builder
        run: gradle --no-daemon -p android/game-patcher :app:testDebugUnitTest :app:assembleDebug

      - name: Stage artifact
        run: |
          set -euo pipefail
          mkdir -p dist/game-patcher
          cp android/game-patcher/app/build/outputs/apk/debug/app-debug.apk \
            dist/game-patcher/ADOFAI-3.3.1-Game-Patcher.apk
          sha256sum dist/game-patcher/ADOFAI-3.3.1-Game-Patcher.apk \
            | tee dist/game-patcher/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: adofai-3.3.1-game-patcher-apk
          path: dist/game-patcher/
          if-no-files-found: error
          retention-days: 14
