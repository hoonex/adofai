name: Build ADOFAI Native Inventory Probe

on:
  push:
    branches:
      - feat/modern-mobile-editor
    paths:
      - 'android/native-inventory-probe/**'
      - '.github/workflows/native-inventory-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-inventory-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build native inventory probe APK
        run: gradle --no-daemon -p android/native-inventory-probe :app:assembleDebug

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp android/native-inventory-probe/app/build/outputs/apk/debug/app-debug.apk dist/ADOFAI-Native-Inventory.apk
          sha256sum dist/ADOFAI-Native-Inventory.apk | tee dist/SHA256SUMS.txt

      - name: Upload probe APK
        uses: actions/upload-artifact@v4
        with:
          name: adofai-native-inventory-probe-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14
