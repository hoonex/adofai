name: Build ADOFAI 2.4 Custom One-Click Patcher

on:
  push:
    branches:
      - fix/v240-custom-bugfix
    paths:
      - 'android/game-patcher/**'
      - 'scripts/prepare-v240-bugfix-upstream.sh'
      - 'scripts/build-v240-picker-payload.sh'
      - 'tools/apply_hitmargin_file_dialogs.py'
      - 'tools/apply_hitmargin_storage_guard.py'
      - 'tools/apply_hitmargin_picker_cancel_guard.py'
      - '.github/workflows/v240-custom-patcher.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adofai-v240-custom-patcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;36.0.0'

      - name: Build optional 2.4 Java picker payload
        run: bash scripts/build-v240-picker-payload.sh .work/v240-picker-payload

      - name: Stage Java-only payload
        run: |
          set -euo pipefail
          ASSETS=android/game-patcher/app/src/main/assets/payload
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp .work/v240-picker-payload/classes2.dex "$ASSETS/classes2.dex"
          test -s "$ASSETS/classes2.dex"
          test ! -e "$ASSETS/libOctober.so"

      - name: Compile 2.4 one-click patcher
        run: gradle --no-daemon -p android/game-patcher :app:testDebugUnitTest :app:assembleDebug

      - name: Verify legacy-preservation contract
        run: |
          set -euo pipefail
          PIPE=android/game-patcher/app/src/main/java/dev/hoonex/adofai/gamepatcher/V240PatchPipeline.java
          MUT=android/game-patcher/app/src/main/java/dev/hoonex/adofai/gamepatcher/ApkMutator.java
          MAIN=android/game-patcher/app/src/main/java/dev/hoonex/adofai/gamepatcher/MainActivity.java
          grep -q 'EXPECTED_VERSION = "2.4.0"' "$PIPE"
          grep -q 'Never require, replace or inject libOctober' "$PIPE"
          grep -q 'return null;' "$PIPE"
          grep -q 'preserves every native library' "$MUT"
          grep -q 'selectorDexEntry != null' "$MUT"
          grep -q '기존 native/URL loader: 보존' "$MAIN"
          ! grep -q 'sourceOctoberSha256' "$PIPE"
          test -s android/game-patcher/app/build/outputs/apk/debug/app-debug.apk

      - name: Stage artifact
        run: |
          set -euo pipefail
          mkdir -p dist/v240-patcher
          cp android/game-patcher/app/build/outputs/apk/debug/app-debug.apk \
            dist/v240-patcher/ADOFAI-2.4.0-Custom-Bugfix-Patcher.apk
          sha256sum dist/v240-patcher/ADOFAI-2.4.0-Custom-Bugfix-Patcher.apk \
            | tee dist/v240-patcher/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: adofai-v240-custom-bugfix-patcher-apk
          path: dist/v240-patcher/
          if-no-files-found: error
          retention-days: 14
