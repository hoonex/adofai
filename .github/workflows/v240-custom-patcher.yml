name: Build ADOFAI 2.4 Custom One-Click Patcher

on:
  push:
    branches:
      - fix/v240-custom-bugfix
    paths:
      - 'android/game-patcher/**'
      - 'android/v240-fixed-runtime/**'
      - 'scripts/build-v240-fixed-java.sh'
      - 'scripts/build-v240-fixed-native.sh'
      - '.github/workflows/v240-custom-patcher.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adofai-v240-custom-patcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865'

      - name: Build exact 2.4 Java runtime
        run: bash scripts/build-v240-fixed-java.sh .work/v240-fixed-java

      - name: Build exact 2.4 arm64 native runtime
        run: bash scripts/build-v240-fixed-native.sh .work/v240-fixed-native

      - name: Stage exact runtime assets
        run: |
          set -euo pipefail
          ASSETS=android/game-patcher/app/src/main/assets/payload
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp .work/v240-fixed-java/v240-fixed-runtime.dex "$ASSETS/v240-fixed-runtime.dex"
          cp .work/v240-fixed-native/libv240fix.so "$ASSETS/libv240fix.so"
          test -s "$ASSETS/v240-fixed-runtime.dex"
          test -s "$ASSETS/libv240fix.so"
          test ! -e "$ASSETS/libOctober.so"

      - name: Compile and test 2.4 one-click patcher
        run: gradle --no-daemon -p android/game-patcher :app:testDebugUnitTest :app:assembleDebug

      - name: Verify exact-source patch contract
        run: |
          set -euo pipefail
          PIPE=android/game-patcher/app/src/main/java/dev/hoonex/adofai/gamepatcher/V240PatchPipeline.java
          MUT=android/game-patcher/app/src/main/java/dev/hoonex/adofai/gamepatcher/ApkMutator.java
          BOOT=android/game-patcher/app/src/main/java/dev/hoonex/adofai/gamepatcher/V240DexBootstrapPatcher.java
          MANIFEST=android/game-patcher/app/src/main/java/dev/hoonex/adofai/gamepatcher/ManifestStoragePatcher.java
          APK=android/game-patcher/app/build/outputs/apk/debug/app-debug.apk

          grep -q 'EXPECTED_SOURCE_BYTES = 370_092_054L' "$PIPE"
          grep -q '630f519ae1ab3391aad95da90ebc296f4f0f8ae4ea41024ace7349d93926ef30' "$PIPE"
          grep -q 'EXPECTED_VERSION = "2.4.0"' "$PIPE"
          grep -q 'V240DexBootstrapPatcher.containsBootstrapInvoke' "$PIPE"
          grep -q 'snapshotNativeLibraries' "$PIPE"
          grep -q 'assertOriginalNativeLibrariesPreserved' "$PIPE"
          grep -q 'stageV240FixedRuntime' "$PIPE"
          grep -q 'ManifestStoragePatcher.patchV240' "$MUT"
          grep -q 'lib/arm64-v8a/libv240fix.so' "$MUT"
          grep -q 'classes2.dex' "$MUT"
          grep -q 'UnityPlayerActivity' "$BOOT"
          grep -q 'V240Bootstrap' "$BOOT"
          grep -q 'V240PickerActivity' "$MANIFEST"
          ! grep -q 'MANAGE_EXTERNAL_STORAGE.*patchV240' "$MANIFEST"

          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/payload/v240-fixed-runtime.dex'
          unzip -l "$APK" | grep -q 'assets/payload/libv240fix.so'
          ! unzip -l "$APK" | grep -q 'assets/payload/libOctober.so'

      - name: Stage artifact
        run: |
          set -euo pipefail
          mkdir -p dist/v240-patcher
          cp android/game-patcher/app/build/outputs/apk/debug/app-debug.apk \
            dist/v240-patcher/ADOFAI-2.4.0-Custom-Bugfix-Patcher.apk
          sha256sum dist/v240-patcher/ADOFAI-2.4.0-Custom-Bugfix-Patcher.apk \
            | tee dist/v240-patcher/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: adofai-v240-custom-bugfix-patcher-apk
          path: dist/v240-patcher/
          if-no-files-found: error
          retention-days: 14
