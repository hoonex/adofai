name: verify

on:
  push:
    branches: [feat/modern-mobile-editor]
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ADOFAI compatibility tests
        run: python -m unittest discover -s tests -v

      - name: Prepare pinned mobile hook source
        run: bash scripts/prepare-upstream.sh

      - name: Verify editor-critical hooks are present
        run: |
          set -euo pipefail
          SRC=.work/hitmargin-mobile-mod/app/src/main/jni
          grep -q 'enableEditorDesktopMode' "$SRC/Main.cpp"
          grep -q 'SaveFilePanel hook installed' "$SRC/FilePicker.cpp"
          grep -q 'OpenFolderPanel hook installed' "$SRC/FilePicker.cpp"
          grep -q 'PathToStringArray' "$SRC/FilePicker.cpp"

  android-build:
    needs: compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install reproducible Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            'platforms;android-35' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865'

      - name: Prepare pinned patched source
        run: bash scripts/prepare-upstream.sh

      - name: Build file picker DEX
        run: |
          set -euo pipefail
          SRC=.work/hitmargin-mobile-mod/app/src/main/java/com/unity3d/player
          OUT=.work/build
          mkdir -p "$OUT/classes" "$OUT/dex"
          javac \
            -source 8 -target 8 \
            -bootclasspath "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" \
            -d "$OUT/classes" \
            "$SRC/CustomFileChooser.java" \
            "$SRC/FileSelector.java"
          jar cf "$OUT/filepicker.jar" -C "$OUT/classes" .
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/d8" \
            --min-api 23 \
            --output "$OUT/dex" \
            "$OUT/filepicker.jar"
          mv "$OUT/dex/classes.dex" "$OUT/classes2.dex"
          test -s "$OUT/classes2.dex"

      - name: Build native hook library
        run: |
          set -euo pipefail
          JNI=.work/hitmargin-mobile-mod/app/src/main/jni
          "$ANDROID_SDK_ROOT/ndk/29.0.14206865/ndk-build" \
            -C "$JNI" \
            -j2
          LIB=.work/hitmargin-mobile-mod/app/src/main/libs/arm64-v8a/libOctober.so
          test -s "$LIB"
          cp "$LIB" .work/build/libOctober.so

      - name: Record artifact integrity
        run: |
          cd .work/build
          sha256sum classes2.dex libOctober.so > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-editor-patch-binaries
          path: |
            .work/build/classes2.dex
            .work/build/libOctober.so
            .work/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
