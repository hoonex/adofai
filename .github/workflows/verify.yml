name: verify

on:
  push:
    branches: [feat/modern-mobile-editor]
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ADOFAI compatibility tests
        run: python -m unittest discover -s tests -v

      - name: Materialize pinned mobile hook source
        run: |
          set -euo pipefail
          mkdir -p .work
          git clone --filter=blob:none https://github.com/HitMargin/A-Dance-of-Fire-and-Ice-Mobile---Load-Custom-Level.git .work/hitmargin-mobile-mod
          git -C .work/hitmargin-mobile-mod checkout --detach 74bcc7a0d8c8be1267504e21e28a35e199b5d4eb
          test "$(git -C .work/hitmargin-mobile-mod rev-parse HEAD)" = 74bcc7a0d8c8be1267504e21e28a35e199b5d4eb

      - name: Apply identity-checked desktop editor transform
        run: python tools/apply_hitmargin_editor_mode.py .work/hitmargin-mobile-mod

      - name: Apply complete file dialog patch
        run: |
          git -C .work/hitmargin-mobile-mod apply --check "$GITHUB_WORKSPACE/patches/hitmargin/0002-complete-file-dialog-hooks.patch"
          git -C .work/hitmargin-mobile-mod apply "$GITHUB_WORKSPACE/patches/hitmargin/0002-complete-file-dialog-hooks.patch"

      - name: Check patched source for whitespace errors
        run: git -C .work/hitmargin-mobile-mod diff --check

      - name: Verify editor-critical hooks are present
        run: |
          set -euo pipefail
          SRC=.work/hitmargin-mobile-mod/app/src/main/jni
          grep -q 'enableEditorDesktopMode' "$SRC/Main.cpp"
          grep -q 'SaveFilePanel hook installed' "$SRC/FilePicker.cpp"
          grep -q 'OpenFolderPanel hook installed' "$SRC/FilePicker.cpp"
          grep -q 'PathToStringArray' "$SRC/FilePicker.cpp"
