name: Build ADOFAI 2.4 Fixed Native Runtime

on:
  push:
    branches:
      - fix/v240-custom-bugfix
    paths:
      - 'android/v240-fixed-runtime/native/**'
      - 'scripts/build-v240-fixed-native.sh'
      - 'tests/test_v240_performance_runtime.py'
      - 'tests/test_v240_event_runtime_probe.py'
      - 'tests/test_v240_post_v240_runtime_probe.py'
      - 'tests/test_v240_tile_dimensions_live_snapshot.py'
      - 'fixtures/device/ADOFAI_2.4_TILEDIMENSIONS_OBSERVATION_TEST.adofai'
      - '.github/workflows/v240-fixed-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adofai-v240-fixed-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify high-refresh safety contract
        run: python3 -m unittest discover -s tests -p 'test_v240_performance_runtime.py'

      - name: Verify event compatibility probe stays read-only
        run: python3 -m unittest discover -s tests -p 'test_v240_event_runtime_probe.py' -v

      - name: Verify post-v2.4 feasibility probe stays read-only
        run: python3 -m unittest discover -s tests -p 'test_v240_post_v240_runtime_probe.py' -v

      - name: Verify TileDimensions live snapshot stays read-only
        run: python3 -m unittest discover -s tests -p 'test_v240_tile_dimensions_live_snapshot.py' -v

      - uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 still defaults to the removed legacy `tools` package.
          # Request only the package this action actually needs; pinned NDK is installed below.
          packages: platform-tools

      - name: Install pinned NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'ndk;29.0.14206865'

      - name: Build arm64 native runtime
        run: bash scripts/build-v240-fixed-native.sh dist/v240-fixed-native

      - name: Verify runtime contract
        run: |
          set -euo pipefail
          test -s dist/v240-fixed-native/libv240fix.so
          readelf -h dist/v240-fixed-native/libv240fix.so | grep -q 'AArch64'
          readelf -Ws dist/v240-fixed-native/libv240fix.so | grep -q 'JNI_OnLoad'
          readelf -Ws dist/v240-fixed-native/libv240fix.so | grep -q 'V240SettingsOverlay_nativeApply'
          readelf -Ws dist/v240-fixed-native/libv240fix.so | grep -q 'V240RunPostV240FeasibilityProbe'
          readelf -Ws dist/v240-fixed-native/libv240fix.so | grep -q 'Java_com_unity3d_player_V240EventCompat_nativeRegisterTileDimensionsSnapshot'
          readelf -Ws dist/v240-fixed-native/libv240fix.so | grep -q 'V240CopyTileDimensionsLiveSnapshot'
          strings dist/v240-fixed-native/libv240fix.so | grep -q 'StandaloneFileBrowser'
          strings dist/v240-fixed-native/libv240fix.so | grep -q 'SaveFilePanelAsync'
          strings dist/v240-fixed-native/libv240fix.so | grep -q 'OpenFilePanelAsync'
          strings dist/v240-fixed-native/libv240fix.so | grep -q 'set_targetFrameRate'
          strings dist/v240-fixed-native/libv240fix.so | grep -q 'set_vSyncCount'
          strings dist/v240-fixed-native/libv240fix.so | grep -q 'compatibility surface LevelData='
          strings dist/v240-fixed-native/libv240fix.so | grep -q 'scrCamera.SetCustomFrameRate='
          strings dist/v240-fixed-native/libv240fix.so | grep -q 'TileDimensions.liveSnapshot.status=ready'
          strings dist/v240-fixed-native/libv240fix.so | grep -q 'TileDimensions.liveSnapshot.mutatesRuntime=0'
          strings dist/v240-fixed-native/libv240fix.so | grep -q 'TileDimensions.liveSnapshot.conversionAssumption=none'
          strings dist/v240-fixed-native/libv240fix.so | grep -q 'V240: EmitParticle ABI'
          strings dist/v240-fixed-native/libv240fix.so | grep -q 'V240: SetInputEvent feasibility'
          strings dist/v240-fixed-native/libv240fix.so | grep -q 'V240: SetFilterAdvanced feasibility'

      - uses: actions/upload-artifact@v4
        with:
          name: adofai-v240-fixed-native-runtime
          path: dist/v240-fixed-native/
          if-no-files-found: error
          retention-days: 14
