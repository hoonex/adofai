name: Build ADOFAI Custom

on:
  push:
    branches:
      - feat/modern-mobile-editor
    paths:
      - 'android/editor-harness/**'
      - 'android/mobile-editor-shell/**'
      - 'scripts/prepare-editor-harness.sh'
      - 'tools/apply_mobile_editor_document_safety.py'
      - 'tools/apply_mobile_editor_json_strictness.py'
      - 'tools/apply_mobile_editor_picker_serialization.py'
      - 'tools/apply_mobile_editor_dirty_close_guard.py'
      - 'tools/apply_companion_editor_mode.py'
      - 'tools/apply_custom_game_mode.py'
      - '.github/workflows/editor-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adofai-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare canonical custom-game sources
        run: bash scripts/prepare-editor-harness.sh

      - name: Build ADOFAI Custom APK
        run: gradle --no-daemon -p android/editor-harness :app:assembleDebug

      - name: Stage artifact
        run: |
          mkdir -p dist/adofai-custom
          cp android/editor-harness/app/build/outputs/apk/debug/app-debug.apk \
            dist/adofai-custom/ADOFAI-Custom.apk
          sha256sum dist/adofai-custom/ADOFAI-Custom.apk \
            | tee dist/adofai-custom/SHA256SUMS.txt

      - name: Upload ADOFAI Custom APK
        uses: actions/upload-artifact@v4
        with:
          name: adofai-custom-apk
          path: dist/adofai-custom/
          if-no-files-found: error
          retention-days: 14
