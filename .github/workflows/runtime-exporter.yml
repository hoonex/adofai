name: Build ADOFAI Runtime Exporter

on:
  push:
    branches:
      - feat/modern-mobile-editor
    paths:
      - 'android/runtime-exporter/**'
      - '.github/workflows/runtime-exporter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build exporter APK
        run: gradle --no-daemon -p android/runtime-exporter :app:assembleDebug

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp android/runtime-exporter/app/build/outputs/apk/debug/app-debug.apk dist/ADOFAI-Runtime-Exporter.apk
          sha256sum dist/ADOFAI-Runtime-Exporter.apk | tee dist/SHA256SUMS.txt

      - name: Upload exporter APK
        uses: actions/upload-artifact@v4
        with:
          name: adofai-runtime-exporter-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14
