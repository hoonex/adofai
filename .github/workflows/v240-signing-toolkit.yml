name: Build ADOFAI 2.4 Signing Toolkit

on:
  push:
    branches: [fix/v240-custom-bugfix]
    paths:
      - '.github/workflows/v240-signing-toolkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android signing tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'build-tools;36.0.0'

      - name: Stage portable signing toolkit
        run: |
          set -euo pipefail
          ROOT="${ANDROID_SDK_ROOT}/build-tools/36.0.0"
          OUT='dist/v240-signing-toolkit'
          test -x "${ROOT}/zipalign"
          test -x "${ROOT}/apksigner"
          test -s "${ROOT}/lib/apksigner.jar"
          "${ROOT}/apksigner" version

          CPP_PATH="$(ldd "${ROOT}/zipalign" | awk '$1 == "libc++.so" {print $3; exit}')"
          test -n "${CPP_PATH}"
          test -s "${CPP_PATH}"

          rm -rf "${OUT}"
          mkdir -p "${OUT}/lib" "${OUT}/lib64"
          cp "${ROOT}/apksigner" "${OUT}/apksigner"
          cp "${ROOT}/lib/apksigner.jar" "${OUT}/lib/apksigner.jar"
          cp "${ROOT}/zipalign" "${OUT}/zipalign.bin"
          cp "${CPP_PATH}" "${OUT}/lib64/libc++.so"

          cat > "${OUT}/zipalign" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          SELF_DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="${SELF_DIR}/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          exec "${SELF_DIR}/zipalign.bin" "$@"
          EOF

          chmod +x "${OUT}/apksigner" "${OUT}/zipalign" "${OUT}/zipalign.bin"
          "${OUT}/apksigner" version
          ZIPALIGN_HELP="$("${OUT}/zipalign" -h 2>&1 || true)"
          grep -q 'Usage' <<< "${ZIPALIGN_HELP}"

          (
            cd "${OUT}"
            sha256sum apksigner lib/apksigner.jar zipalign zipalign.bin lib64/libc++.so > SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v4
        with:
          name: adofai-v240-signing-toolkit
          path: dist/v240-signing-toolkit/
          if-no-files-found: error
          retention-days: 7
