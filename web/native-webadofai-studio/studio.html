<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#111924"/>
<title>Web ADOFAI Native Studio · 검색 · 커스텀 제작 · 원본 플레이</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color-scheme:dark;color:#e7eef8;background:#0c131d}
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #485a70;background:#23364b;border-radius:5px;padding:9px 11px;font-size:12px;font-weight:650;min-height:36px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #8ecaff;outline-offset:1px}button:hover:not(:disabled){background:#365573}button:disabled{opacity:.36;cursor:not-allowed}
header{height:58px;min-height:58px;display:flex;align-items:center;gap:12px;background:#192532;border-bottom:1px solid #3d5065;padding:8px 14px}
.logo{font-size:15px;font-weight:800;white-space:nowrap;letter-spacing:.035em;color:#f5f9ff}.logo span{font-size:10px;display:block;letter-spacing:0;color:#90aabe;font-weight:500}
.tabs{display:flex;gap:6px;margin-left:12px}.tabs button{border-radius:5px;font-size:13px}.tabs button[aria-pressed=true]{background:#3675a7;border-color:#67a4dc;color:white}
.external{font-size:12px;text-decoration:none;color:#a5d3f2;margin-left:auto;white-space:nowrap}.external:hover{text-decoration:underline}
.app{min-height:0;flex:1;display:flex}.tools{background:#192532;border-right:1px solid #41566b;min-width:310px;width:340px;max-width:44vw;display:flex;flex-direction:column;overflow:auto;scrollbar-color:#526a82 transparent}
.tools[hidden]{display:none}.tools .sect{padding:12px 14px;border-bottom:1px solid #34465b}.tools h2{font-size:14px;margin:0 0 9px;color:#d7e6f4}.tools p{font-size:11px;color:#a7bed1;margin:6px 0;line-height:1.55}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}.btnrow button{flex:1;min-width:65px}.primary{background:#2e71a4;border-color:#619ecc}.success{background:#2b674f;border-color:#5f9d7f}.danger{background:#6a2934;border-color:#925462}
input:not([type=file]),select,textarea{display:block;width:100%;background:#0d1825;border:1px solid #4a6077;border-radius:4px;padding:9px;font-size:12px;min-height:35px}
input[type=number]{font-variant-numeric:tabular-nums}label{font-size:11px;color:#b2c9db;display:block;margin-bottom:6px}label input,label select{margin-top:5px}
.smallgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.smallgrid .btnrow{grid-column:span 2}
textarea{min-height:135px;resize:vertical;line-height:1.4;font-family:ui-monospace,Consolas,monospace}.pane-tabs{display:flex;gap:5px}.pane-tabs button{flex:1;font-size:11px;padding:8px 4px}.pane-tabs button[aria-pressed=true]{background:#3a6b90}.editpane[hidden]{display:none}
#info{font-size:11px;color:#b2d4ee;line-height:1.6;min-height:26px}.status{font-size:11px;line-height:1.6;color:#95bad9;padding:10px 14px;background:#111c2b;border-top:1px solid #334b63;position:sticky;bottom:0}.status.error{color:#ffaeab}.status.ok{color:#a5e8c3}
.stage{flex:1;min-width:0;position:relative;background:#050b14}.stage iframe{border:0;width:100%;height:100%;display:block}.overlay{position:absolute;left:12px;top:12px;z-index:2;display:flex;gap:7px;pointer-events:none}.overlay button{pointer-events:auto;background:#12223deb;box-shadow:0 2px 9px #000a}.overlay .primary{background:#2c6c9be8}
#siteNotice{position:absolute;z-index:3;bottom:15px;left:14px;right:14px;pointer-events:none;background:#091829ca;border:1px solid #41617e;border-radius:6px;padding:8px;font-size:11px;color:#b7cada;line-height:1.5;max-width:660px}
#drop{border:1px dashed #6a829d;padding:14px;border-radius:7px;text-align:center;font-size:12px;color:#b5cbe1;margin-top:7px;cursor:pointer;background:#142639}#drop:hover{background:#203954}
@media(max-width:760px){header{height:56px;min-height:56px;padding:8px 8px;gap:5px}.logo{font-size:12px}.logo span{font-size:9px}.tabs{margin-left:4px;gap:3px}.tabs button{padding:7px;font-size:11px}.external{font-size:10px}.app{flex-direction:column}.tools{max-width:100%;width:100%;min-width:0;max-height:41dvh;min-height:120px;display:block;border-right:0;border-bottom:1px solid #45647b}.tools[hidden]{display:none}.tools .sect{padding:7px 10px}.stage{min-height:0;flex:1}.overlay{top:7px;left:7px}.overlay button{font-size:10px;padding:6px 8px}.status{position:static}.tools textarea{min-height:90px}#siteNotice{font-size:10px;bottom:8px;left:7px;right:7px}}
</style>
</head>
<body>
<header>
  <div class="logo">WEB ADOFAI <span>Native Studio · 원본 게임 통합</span></div>
  <div class="tabs"><button id="searchTab" aria-pressed="true">🔎 검색·플레이</button><button id="editTab" aria-pressed="false">✎ 커스텀 제작</button></div>
  <a class="external" href="https://web-adofai.impl1113.dev/levels" rel="noopener noreferrer" target="_blank">원본 사이트 ↗</a>
</header>
<div class="app">
<aside class="tools" id="tools" hidden>
 <div class="sect"><h2>내 차트 파일</h2>
 <div class="btnrow"><button id="openFile" class="primary">ZIP / .adofai 열기</button><button id="newLevel">새 차트</button></div>
 <input id="picker" type="file" accept=".zip,.adofai,application/zip,application/json" hidden>
 <div id="drop">여기로 ZIP 또는 .adofai 드롭</div>
 <p id="info">차트를 선택하거나 새 차트를 만드세요.</p>
 <div class="btnrow"><button id="addAudio">음악 파일 선택</button><button id="saveZip">ZIP 저장</button></div>
 <input id="audioPicker" type="file" accept="audio/*,.ogg,.mp3,.wav" hidden>
 </div>
 <div class="sect"><h2>타일 편집</h2><div class="smallgrid">
 <label>타일 번호<input id="floor" type="number" min="0" step="1" value="1"></label>
 <label>방향 각도<input id="angle" type="number" step="any" value="0"></label>
 <div class="btnrow"><button id="prevFloor">◀ 이전</button><button id="nextFloor">다음 ▶</button></div>
 <div class="btnrow"><button id="setAngle" class="primary">각도 적용</button><button id="addFloor">타일 추가</button><button id="deleteFloor" class="danger">타일 삭제</button></div>
 <div class="btnrow"><button id="undo">↶ 되돌리기</button><button id="redo">↷ 다시</button></div>
 </div><p>변경 사항은 원본 게임의 레벨 캐시에 기록한 뒤 게임 화면을 다시 로드합니다.</p></div>
 <div class="sect"><h2>이벤트·레벨 설정</h2><div class="pane-tabs"><button data-pane="events" aria-pressed="true">이벤트</button><button data-pane="settings" aria-pressed="false">설정</button><button data-pane="raw" aria-pressed="false">전체 차트</button></div>
 <div class="editpane" id="eventsPane"><label>선택 타일의 이벤트<select id="eventSelect"></select></label><textarea id="eventText" spellcheck="false" placeholder='{"floor":1,"eventType":"Twirl"}'></textarea><div class="btnrow"><button id="addEvent">+ 이벤트</button><button id="updateEvent" class="primary">수정 적용</button><button id="deleteEvent" class="danger">이벤트 삭제</button></div></div>
 <div class="editpane" id="settingsPane" hidden><textarea id="settingsText" spellcheck="false"></textarea><button id="applySettings">설정 반영</button></div>
 <div class="editpane" id="rawPane" hidden><textarea id="rawText" spellcheck="false"></textarea><button id="applyRaw">전체 JSON 반영</button></div>
 </div>
 <div id="status" class="status" aria-live="polite">원본 엔진 준비 중…</div>
</aside>
<main class="stage">
  <iframe id="engine" src="/levels" allow="autoplay; fullscreen; gamepad" title="원본 Web ADOFAI 레벨 목록 및 플레이 엔진"></iframe>
  <div class="overlay"><button id="applyEngine" class="primary" hidden>⟳ 편집 내용 적용</button><button id="playEngine" class="success" hidden>▶ 원본 게임 플레이</button><button id="backSearch" hidden>검색 목록</button></div>
  <div id="siteNotice">게임 화면은 Web ADOFAI 원본 서버에서 실시간으로 받아옵니다. 원본 소스 전체를 복제한 독립 게임이 아니며, 저작권·이용 조건은 원 제작자에게 있습니다. <b>WebGPU 지원 브라우저</b>가 필요합니다.</div>
</main>
</div>
<script src="/__jszip.js"></script>
<script src="/__studio.js"></script>
</body>
</html>
